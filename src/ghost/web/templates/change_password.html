{% extends "base.html" %}
{% block title %}Change password · fastapi-ghost{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h2>Change password</h2>
  {% if user.must_change_password %}<p class="muted">You are using a default password. Choose a new one to continue.</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/change-password">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required autofocus>
    <label for="new_password">New password (8+ characters)</label>
    <input id="new_password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
    <p><button type="submit">Change password</button></p>
  </form>
</div>
{% endblock %}
