{% extends "base.html" %}
{% block title %}Sign in · fastapi-ghost{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h2>Sign in</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="email">Email or username</label><input id="email" name="email" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" required>
    <p><button type="submit">Sign in</button></p>
  </form>
  <p class="muted">No account? <a href="/register">Create one</a></p>
</div>
{% endblock %}
