{% extends "base.html" %}
{% block title %}Create account · fastapi-ghost{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h2>Create account</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if open %}
  <form method="post" action="/register">
    <label for="email">Email</label><input id="email" name="email" type="email" required autofocus>
    <label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" minlength="8" required>
    <p><button type="submit">Create account</button></p>
  </form>
  {% else %}<p class="muted">Sign-up is disabled on this server.</p>{% endif %}
  <p class="muted">Already registered? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
