[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-ghost"
version = "0.1.0"
description = "Discover, probe and report on the endpoints of a running FastAPI server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akshat Gandhi" }]
keywords = ["fastapi", "openapi", "api-testing", "contract", "latency", "report"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27", "typer>=0.12", "rich>=13", "jsonschema>=4",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]
ui = ["playwright>=1.40"]
dev = ["fastapi-ghost[web]", "fastapi-ghost[ui]", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/Akshat-Gandhi/fastapi-ghost"
Issues = "https://github.com/Akshat-Gandhi/fastapi-ghost/issues"

[project.scripts]
ghost = "ghost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]


[tool.pytest.ini_options]
testpaths = ["tests"]
