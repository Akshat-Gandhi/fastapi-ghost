[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-ghost"
version = "0.0.1"
description = "Discover, probe and report on the endpoints of a running FastAPI server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]
dev = ["fastapi-ghost[web]", "pytest>=8"]

[project.scripts]
ghost = "ghost.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]


[tool.pytest.ini_options]
testpaths = ["tests"]
